<div class="chat-container">
  <div class="chat-header">
    <h1></h1>
    <div>
      <agent-selector (agentIsSelected)="onAgentSelected($event)"></agent-selector>
      <div class="agent-details">
        {{ selectedAgentName ? 'Name: ' + selectedAgentName : 'No Agent Selected' }}<br />
        {{ selectedAgentID ? 'ID: ' + selectedAgentID : '' }}
      </div>
    </div>
  </div>

  <div class="messages-container" #messagesContainer>
    <div class="messages">
      <div *ngIf="messages.length === 0" class="welcome-message">
        <img src="assets/kd-bg-image.png" class="kd-bg-image">
      </div>

      <div *ngFor="let message of messages" class="message"
        [ngClass]="{'user-message': message.sender === 'user', 'assistant-message': message.sender === 'assistant'}">
        <div class="message-avatar">
          <div class="avatar" [ngClass]="message.sender">
            <span *ngIf="message.sender === 'user'">U</span>
            <svg *ngIf="message.sender === 'assistant'" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
            </svg>
          </div>
        </div>
        <div class="message-content">
          <div class="message-text">{{ message.content }}</div>
          <div class="message-time">{{ formatTime(message.timestamp) }}</div>
        </div>
      </div>

      <div *ngIf="isTyping" class="message assistant-message typing">
        <div class="message-avatar">
          <div class="avatar assistant">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
            </svg>
          </div>
        </div>
        <div class="message-content">
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="input-container">
    <div class="input-wrapper">
      <textarea [(ngModel)]="currentMessage" (keydown)="handleKeyDown($event)"
        placeholder="Ask Knowledge Discovery Agent.." class="message-input" rows="1" #messageInput></textarea>
      <button class="send-button" (click)="sendMessage()" [disabled]="!currentMessage.trim() || isTyping">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22,2 15,22 11,13 2,9"></polygon>
        </svg>

      </button>
    </div>
  </div>
</div>
